# ===============================
# DEV PROFILE (H2 IN-MEMORY FOR LOCAL REVIEW)
# ===============================
spring.datasource.url=jdbc:h2:mem:financeall;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Flyway in dev so Hibernate creates schema automatically in H2
spring.flyway.enabled=false

# Live-reload templates during development
spring.thymeleaf.cache=false

# Verbose logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
