# ===============================
# DEV PROFILE
# Datasource is inherited from application.properties.
# Run locally with: SPRING_PROFILES_ACTIVE=dev
# Set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD via env (or .env / IDE run config).
# ===============================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Live-reload templates during development
spring.thymeleaf.cache=false

# Verbose logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
