spring.application.name=financeall

# Default profile; override with SPRING_PROFILES_ACTIVE=dev for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

server.port=${PORT:8080}

# ===============================
# DATASOURCE (single source of truth for all profiles)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================
# 'validate' fails fast if the schema does not match the entities.
# Flyway creates/updates the schema BEFORE Hibernate validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# FLYWAY MIGRATIONS
# ===============================
spring.flyway.enabled=true
# Allow Flyway to adopt a pre-existing (already populated) database as baseline v1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# ACTUATOR (health checks for Docker / platforms)
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
