<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profil Admin - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content d-flex justify-content-center">
    <div class="corporate-card p-4" style="width: 100%; max-width: 640px;">
        
        <div class="mb-4 text-center">
            <span class="eyebrow">ADMINISTRATOR</span>
            <h2 class="headline fw-bold text-dark mb-1">Profil Admin</h2>
            <p class="body-sm text-secondary">Perbarui kredensial akun administrator Anda.</p>
        </div>

        <div th:if="${param.success != null}" class="p-3 mb-4 badge bg-success w-100 justify-content-start text-start">
            <span>Profil admin berhasil diperbarui!</span>
        </div>
        <div th:if="${errorMsg}" class="p-3 mb-4 badge bg-danger w-100 justify-content-start text-start">
            <span th:text="${errorMsg}"></span>
        </div>

        <form th:action="@{/admin/profile/update}" method="post" class="d-flex flex-column gap-3">
            <div>
                <label class="form-label">USERNAME ADMIN</label>
                <input type="text" name="username" th:value="${(admin ?: adminUser)?.username}" class="form-control" required>
            </div>
            
            <div>
                <label class="form-label">ALAMAT EMAIL</label>
                <input type="email" name="email" th:value="${(admin ?: adminUser)?.email}" class="form-control" required>
            </div>
            
            <div class="p-3 mt-2 rounded-3" style="background-color: var(--color-surface-soft); border: 1px solid var(--color-hairline);">
                <label class="form-label text-danger">UBAH PASSWORD (OPSIONAL)</label>
                <input type="password" name="password" class="form-control" placeholder="Biarkan kosong jika tidak ingin mengubah sandi">
            </div>

            <button type="submit" class="btn-primary mt-3 w-100">Simpan Perubahan Profile</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
