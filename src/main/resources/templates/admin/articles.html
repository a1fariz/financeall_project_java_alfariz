<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Articles - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="glass-card">
                <h3 class="fw-bold mb-1">📢 Create Article</h3>
                <p class="text-secondary mb-4">Broadcast information to all users</p>
                
                <form th:action="@{/admin/articles/add}" method="post" class="d-flex flex-column gap-3">
                    <div>
                        <label class="form-label small fw-semibold">Article Title</label>
                        <input type="text" name="title" placeholder="Enter title..." required class="form-control">
                    </div>
                    <div>
                        <label class="form-label small fw-semibold">Content Body</label>
                        <textarea name="content" rows="5" class="form-control" placeholder="Write your message here..." required></textarea>
                    </div>
                    <button type="submit" class="btn-auth mt-2">🚀 Post Article</button>
                </form>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="glass-card">
                <h3 class="fw-bold mb-4">Recent Published Articles</h3>
                <div th:if="${#lists.isEmpty(articles)}" class="text-center py-4 text-secondary opacity-75">
                    No articles published yet.
                </div>
                
                <div class="d-flex flex-column gap-3">
                    <div th:each="a : ${articles}" class="p-3 rounded-3" style="background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);">
                        <div class="d-flex justify-content-between align-items-start gap-2">
                            <div>
                                <h5 class="fw-bold mb-1" style="color: var(--accent);" th:text="${a.title}"></h5>
                                <small class="text-secondary d-block mb-2" th:text="${#temporals.format(a.createdAt, 'dd MMM yyyy HH:mm')}"></small>
                                <p class="mb-0 text-secondary" style="font-size: 0.95rem;" th:text="${a.content}"></p>
                            </div>
                            <form th:action="@{/admin/articles/delete/{id}(id=${a.id})}" method="post" class="m-0"
                                  onsubmit="return confirm('Hapus artikel ini?')">
                                <button type="submit" class="btn-primary py-1 px-2" style="background: var(--danger); font-size: 0.8rem;">🗑️</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
