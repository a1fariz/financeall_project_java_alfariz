<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Game Progression Levels - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="color-block-section color-block-lilac mb-4">
        <span class="eyebrow">GAMIFIKASI SYSTEM</span>
        <h2 class="display-lg fw-bold mb-1">Game Progression Levels</h2>
        <p class="body-sm mb-0">Atur ambang batas poin (XP) dan tingkat level finansial untuk seluruh pengguna.</p>
    </div>

    <div th:if="${successMsg}" class="p-3 mb-4 badge bg-success w-100 justify-content-start text-start">
        <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}" class="p-3 mb-4 badge bg-danger w-100 justify-content-start text-start">
        <span th:text="${errorMsg}"></span>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="corporate-card p-4">
                <h5 class="headline fw-bold mb-3 text-dark">Tambah Level Baru</h5>
                <form th:action="@{/admin/levels/add}" method="post" class="d-flex flex-column gap-3">
                    <div>
                        <label class="form-label">NAMA LEVEL</label>
                        <input type="text" name="name" class="form-control" required placeholder="Contoh: Master Saver">
                    </div>
                    <div>
                        <label class="form-label">SYARAT XP (REQUIRED POINTS)</label>
                        <input type="number" name="requiredPoints" class="form-control" required placeholder="1000">
                    </div>
                    <button type="submit" class="btn-primary w-100 mt-2">Simpan Level</button>
                </form>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="corporate-card p-4">
                <h5 class="headline fw-bold mb-4 text-dark">Daftar Level Aktif</h5>
                <div class="table-container">
                    <table class="table-modern">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>NAMA LEVEL</th>
                                <th>REQUIRED XP</th>
                                <th class="text-center">AKSI</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="lvl : ${levels}">
                                <td th:text="${lvl.id}"></td>
                                <td class="fw-semibold text-dark" th:text="${lvl.name}"></td>
                                <td class="fw-bold text-success" th:text="${lvl.requiredPoints} + ' XP'"></td>
                                <td class="text-center">
                                    <a th:href="@{/admin/levels/delete/{id}(id=${lvl.id})}" class="btn-danger py-1 px-3" style="font-size: 0.8rem; text-decoration: none;" onclick="return confirm('Hapus level ini?')">
                                        Hapus
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
