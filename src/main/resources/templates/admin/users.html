<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="glass-card mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <h3 class="fw-bold mb-0">👥 User Management</h3>
        <form th:action="@{/admin/users}" method="get" class="d-flex gap-2">
            <input type="hidden" name="sortBy" th:value="${currentSort}">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search username..." class="form-control" style="max-width: 240px;">
            <button type="submit" class="btn-primary">Search</button>
        </form>
    </div>

    <div class="table-container">
        <table class="table-modern">
            <thead>
                <tr>
                    <th><a th:href="@{/admin/users(sortBy='username', keyword=${keyword})}" class="text-decoration-none">Username ↕</a></th>
                    <th><a th:href="@{/admin/users(sortBy='email', keyword=${keyword})}" class="text-decoration-none">Email ↕</a></th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.username}" class="fw-bold"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span class="badge" 
                              th:style="${u.banned} ? 'background: var(--danger); color: white;' : 'background: var(--success); color: white;'"
                              th:text="${u.banned ? 'Banned' : 'Active'}"></span>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <form th:action="@{/admin/users/ban/{id}(id=${u.id})}" method="post" class="m-0">
                                <button type="submit" class="btn-auth py-2 px-3 text-sm" style="font-size: 0.85rem;" th:text="${u.banned ? '✅ Unban' : '🚫 Ban'}"></button>
                            </form>
                            <a th:href="@{/admin/users/delete/{id}(id=${u.id})}" class="btn-primary py-2 px-3 text-sm" style="background: var(--danger); font-size: 0.85rem;" onclick="return confirm('Hapus user ini selamanya?')">🗑️ Delete</a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="4" class="text-center text-secondary py-5">No users found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
