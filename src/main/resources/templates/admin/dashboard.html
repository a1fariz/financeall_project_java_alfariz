<!DOCTYPE html>
<html xmlns:th=\"http://www.thymeleaf.org\">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="glass-card mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="fw-bold mb-1">Admin Dashboard 🛠️</h1>
                <p class="text-secondary mb-0">Monitor FinanceAll system activity and metrics.</p>
            </div>
            <div class="text-md-end">
                <small class="text-secondary d-block">System Status</small>
                <span class="badge" style="background: var(--success); color: white;">ACTIVE</span>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="glass-card stat-card h-100 d-flex align-items-center gap-3">
                <div class="stat-icon"><i class="bi bi-people"></i>👥</div>
                <div>
                    <small class="text-secondary d-block">Total Users</small>
                    <h3 class="fw-bold mb-0" th:text="${totalUsers}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-card stat-card h-100 d-flex align-items-center gap-3" style="border-left-color: var(--success);">
                <div class="stat-icon" style="color: var(--success); background: rgba(16,185,129,0.1);"><i class="bi bi-wallet"></i>💰</div>
                <div>
                    <small class="text-secondary d-block">Global Balance</small>
                    <h4 class="fw-bold mb-0" th:text="'Rp ' + ${#numbers.formatDecimal(globalBalance ?: 0, 0, 'POINT', 0, 'COMMA')}">Rp 0</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="glass-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0">System Logs 📜</h3>
                    <a th:href="@{/admin/logs}" class="nav-link p-0" style="color: var(--accent);">View All &rarr;</a>
                </div>
                
                <div class="table-container">
                    <table class="table-modern">
                        <thead>
                            <tr>
                                <th>Admin</th>
                                <th>Action</th>
                                <th>Detail</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${latestLogs}">
                                <td th:text="${log.user.username}" class="fw-semibold"></td>
                                <td><span class="badge bg-secondary text-uppercase" th:text="${log.action}"></span></td>
                                <td th:text="${log.detail}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(latestLogs)}">
                                <td colspan="3" class="text-center text-secondary py-4">No recent logs available.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="glass-card h-100">
                <h3 class="fw-bold mb-4">Latest Users 👥</h3>
                
                <div th:if="${#lists.isEmpty(latestUsers)}" class="empty-state">
                    <h5>No users found</h5>
                </div>

                <div th:if="${!#lists.isEmpty(latestUsers)}" class="d-flex flex-column gap-3">
                    <div th:each="u : ${latestUsers}" class="d-flex justify-content-between align-items-center p-3 rounded-3" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-color);">
                        <div>
                            <h6 class="fw-bold mb-0" th:text="${u.username}"></h6>
                            <small class="text-secondary" th:text="${u.email}"></small>
                        </div>
                        <span class="badge" style="background: var(--accent); color: white;" th:text="${u.role}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
