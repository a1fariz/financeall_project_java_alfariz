<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">

    <div class="corporate-card p-4 mb-4 shadow-sm" style="background-color: var(--nav-dark); color: white;">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h2 class="fw-bold mb-1 text-white">Hello, <span th:text="${user != null ? user.fullName : 'User'}" style="color: var(--success);">User</span> 👋</h2>
                <p class="mb-0" style="color: #94a3b8;">Ringkasan finansial Anda hari ini.</p>
            </div>
            <div class="text-md-end">
                <small style="color: #94a3b8;">Saldo Aktif</small>
                <h3 class="fw-bold text-success m-0" th:text="${wallet != null ? 'Rp ' + #numbers.formatDecimal(wallet.balance,0,'POINT',0,'COMMA') : 'Rp 0'}"></h3>
            </div>
        </div>
    </div>

    <div th:if="${announcements != null && !#lists.isEmpty(announcements)}" class="mb-4">
        <div th:each="ann : ${announcements}" class="corporate-card p-3 shadow-sm mb-3 d-flex gap-3 align-items-start" style="border-left: 5px solid var(--accent-blue); background: #f0fdf4;">
            <div style="font-size: 1.5rem;">📢</div>
            <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                    <h5 class="fw-bold mb-0 text-dark" th:text="${ann.title}"></h5>
                    <span class="badge bg-secondary opacity-75" style="font-size: 0.75rem;" th:text="${#temporals.format(ann.createdAt,'dd MMM yyyy')}"></span>
                </div>
                <p class="mb-0 text-dark" style="font-size: 0.95rem;" th:text="${ann.content}"></p>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-4 col-md-6">
            <div class="corporate-card p-4 h-100 stat-card shadow-sm" style="border-left-color: var(--success);">
                <small class="text-secondary fw-bold text-uppercase">Pemasukan Bulan Ini</small>
                <h3 class="fw-bold text-dark mt-2" th:text="'Rp ' + ${#numbers.formatDecimal(totalIncome,0,'POINT',0,'COMMA')}">Rp 0</h3>
            </div>
        </div>
        <div class="col-lg-4 col-md-6">
            <div class="corporate-card p-4 h-100 stat-card shadow-sm" style="border-left-color: var(--danger);">
                <small class="text-secondary fw-bold text-uppercase">Pengeluaran Bulan Ini</small>
                <h3 class="fw-bold text-dark mt-2" th:text="'Rp ' + ${#numbers.formatDecimal(totalExpense,0,'POINT',0,'COMMA')}">Rp 0</h3>
            </div>
        </div>
        <div class="col-lg-4 col-md-6">
            <div class="corporate-card p-4 h-100 stat-card shadow-sm" style="border-left-color: var(--warning);">
                <small class="text-secondary fw-bold text-uppercase">Cashflow (Arus Kas)</small>
                <h3 class="fw-bold mt-2" th:classappend="${cashflow >= 0} ? 'text-success' : 'text-danger'" th:text="'Rp ' + ${#numbers.formatDecimal(cashflow,0,'POINT',0,'COMMA')}">Rp 0</h3>
            </div>
        </div>
    </div>

    <div class="corporate-card p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold m-0 text-dark">Transaksi Terakhir</h5>
            <a th:href="@{/user/transaction}" class="btn-primary text-decoration-none py-1 px-3" style="font-size: 0.85rem;">Lihat Semua</a>
        </div>
        
        <div th:if="${#lists.isEmpty(recentTransactions)}" class="text-center py-5 text-secondary">
            <p>Belum ada transaksi. Mulai catat keuangan Anda.</p>
        </div>

        <div th:if="${!#lists.isEmpty(recentTransactions)}" class="table-container">
            <table class="table-modern">
                <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Judul</th>
                    <th>Tipe</th>
                    <th>Kategori</th>
                    <th class="text-end">Nominal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="trx : ${recentTransactions}">
                    <td th:text="${#temporals.format(trx.transactionDate,'dd MMM yyyy')}"></td>
                    <td class="fw-semibold text-dark" th:text="${trx.title}"></td>
                    <td>
                        <span class="badge" th:classappend="${trx.type.name() == 'INCOME'} ? 'bg-success' : 'bg-danger'" th:text="${trx.type.name()}"></span>
                    </td>
                    <td><span class="badge bg-secondary" th:text="${trx.category}"></span></td>
                    <td class="fw-bold text-end" th:classappend="${trx.type.name() == 'INCOME'} ? 'text-success' : 'text-danger'" th:text="'Rp ' + ${#numbers.formatDecimal(trx.amount,0,'POINT',0,'COMMA')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
