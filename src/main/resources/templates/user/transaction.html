<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaksi - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="corporate-card mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2 class="fw-bold mb-1 text-dark">Riwayat Transaksi 📊</h2>
            <p class="text-secondary mb-0">Catat pemasukan dan pengeluaran Anda.</p>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn-primary" style="background: var(--success);" data-bs-toggle="modal" data-bs-target="#incomeModal">➕ Pemasukan</button>
            <button type="button" class="btn-primary" style="background: var(--danger);" data-bs-toggle="modal" data-bs-target="#expenseModal">➖ Pengeluaran</button>
        </div>
    </div>

    <div th:if="${errorMsg}" class="p-3 mb-4 rounded-3 bg-danger" style="border-left: 4px solid var(--danger);">
        <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${successMsg}" class="p-3 mb-4 rounded-3 bg-success" style="border-left: 4px solid var(--success);">
        <span th:text="${successMsg}"></span>
    </div>

    <div class="table-container shadow-sm">
        <table class="table-modern">
            <thead>
            <tr>
                <th>Tanggal</th>
                <th>Judul</th>
                <th>Kategori</th>
                <th>Tipe</th>
                <th class="text-end">Nominal</th>
                <th>Deskripsi</th>
                <th class="text-center">Aksi</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="7" class="text-center py-5 text-muted">Belum ada transaksi.</td>
            </tr>
            <tr th:each="trx : ${transactions}">
                <td th:text="${trx.transactionDate != null ? #temporals.format(trx.transactionDate, 'dd MMM yyyy') : '-'}"></td>
                <td class="fw-semibold text-dark" th:text="${trx.title}"></td>
                <td><span class="badge bg-secondary" th:text="${trx.category}"></span></td>
                <td><span class="badge" th:classappend="${trx.type.name() == 'INCOME'} ? 'bg-success' : 'bg-danger'" th:text="${trx.type.name()}"></span></td>
                <td class="fw-bold text-end" th:classappend="${trx.type.name() == 'INCOME'} ? 'text-success' : 'text-danger'" th:text="${(trx.type.name() == 'EXPENSE' ? '- ' : '+ ') + 'Rp ' + #numbers.formatDecimal(trx.amount, 0, 'POINT', 0, 'COMMA')}"></td>
                <td th:text="${trx.description}"></td>
                <td class="text-center">
                    <a th:href="@{/user/transaction/edit/{id}(id=${trx.id})}" class="btn btn-sm btn-outline-primary py-1 px-2" style="font-size: 0.8rem;">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="incomeModal" tabindex="-1" aria-labelledby="incomeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content corporate-card p-0">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="fw-bold text-dark mb-0">Tambah Pemasukan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/user/transaction/add}" method="post">
                <input type="hidden" name="type" value="INCOME">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Judul</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nominal (Rp)</label>
                        <input type="number" name="amount" class="form-control" required min="1" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal</label>
                        <input type="date" name="transactionDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <select name="category" class="form-select">
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deskripsi</label>
                        <input type="text" name="description" class="form-control">
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="submit" class="btn-primary w-100" style="background: var(--success);">Simpan Pemasukan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="expenseModal" tabindex="-1" aria-labelledby="expenseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content corporate-card p-0">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="fw-bold text-dark mb-0">Tambah Pengeluaran</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/user/transaction/add}" method="post">
                <input type="hidden" name="type" value="EXPENSE">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Judul</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nominal (Rp)</label>
                        <input type="number" name="amount" class="form-control" required min="1" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal</label>
                        <input type="date" name="transactionDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <select name="category" class="form-select">
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deskripsi</label>
                        <input type="text" name="description" class="form-control">
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="submit" class="btn-primary w-100" style="background: var(--danger);">Simpan Pengeluaran</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
