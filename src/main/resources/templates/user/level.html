<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Level Progress - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="color-block-section color-block-lilac mb-4">
        <span class="eyebrow">GAMIFIKASI KEUANGAN</span>
        <h2 class="display-lg fw-bold mb-1">Financial Mastery Level</h2>
        <p class="body-sm mb-0">Tingkatkan level finansial Anda dengan konsisten mencatat keuangan dan membangun aset.</p>
    </div>

    <div class="grid-2">
        <section class="corporate-card p-4">
            <span class="caption text-muted mb-1 d-block">STATUS SAAT INI</span>
            <h1 class="display-lg fw-bold text-dark mb-2" th:text="${progress?.level?.name ?: 'Newbie'}">Newbie</h1>
            <p class="body-sm fw-bold">TOTAL XP: <span class="badge bg-success" style="font-size: 1rem;" th:text="${progress?.currentPoints ?: 0}">0</span></p>
            
            <div class="mt-4">
                <span class="caption text-muted mb-1 d-block">PROGRESS KE LEVEL SELANJUTNYA</span>
                <div class="progress-track mt-2">
                    <div class="progress-fill" th:style="'width: ' + ${progressPercentage ?: 0} + '%; background: var(--color-primary);'"></div>
                </div>
            </div>
        </section>

        <section class="corporate-card p-4">
            <h3 class="headline fw-bold mb-3">Syarat XP Setiap Level</h3>
            <div class="table-container">
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th>LEVEL</th>
                            <th>NAMA LEVEL</th>
                            <th class="text-end">REQUIRED XP</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="l : ${allLevels}">
                            <td th:text="${l.id}"></td>
                            <td class="fw-semibold text-dark" th:text="${l.name}"></td>
                            <td class="text-end fw-bold" th:text="${l.requiredPoints}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
