<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - FinanceAll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-container" style="max-width: 950px;">
        <div class="auth-banner" style="background-color: #1e293b;">
            <h2 class="fw-bold mb-3">Join FinanceAll 📈</h2>
            <p class="mb-0" style="font-size: 1rem; opacity: 0.85; line-height: 1.6;">Mulai pencatatan kekayaan bersih secara riil dengan alokasi otomatis kalkulator Financial Independence.</p>
        </div>

        <div class="auth-form-wrapper">
            <h1 class="fw-bold text-dark mb-1">Create Account</h1>
            <p class="text-muted small mb-4">Lengkapi formulir di bawah ini dengan data valid</p>

            <div th:if="${error}" class="p-3 mb-3 small rounded-3 bg-danger" style="border-left: 4px solid var(--danger);">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" th:field="*{fullName}" placeholder="Nama Sesuai ID" class="form-control" required>
                    <small class="text-danger d-block mt-1 small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
                </div>
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" th:field="*{username}" placeholder="Pilih username unik" class="form-control" required>
                        <small class="text-danger d-block mt-1 small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" placeholder="nama@domain.com" class="form-control" required>
                        <small class="text-danger d-block mt-1 small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{password}" placeholder="••••••••" class="form-control" required>
                        <small class="text-danger d-block mt-1 small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Konfirmasi Password</label>
                        <input type="password" th:field="*{confirmPassword}" placeholder="••••••••" class="form-control" required>
                        <small class="text-danger d-block mt-1 small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
                    </div>
                </div>

                <div>
                    <label class="form-label">Recovery PIN (6 Digit)</label>
                    <input type="text" th:field="*{recoveryPin}" maxlength="6" placeholder="Contoh: 882910" class="form-control" required>
                    <small class="text-danger d-block mt-1 small" th:if="${#fields.hasErrors('recoveryPin')}" th:errors="*{recoveryPin}"></small>
                </div>

                <button type="submit" class="btn-auth w-100 mt-2">Daftar Akun Baru</button>
            </form>

            <div class="text-center mt-4 small text-muted">
                Sudah memiliki akun? <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--accent-blue);">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
