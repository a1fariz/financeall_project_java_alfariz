<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - FinanceAll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page"> 
    <div class="auth-container">
        <div class="auth-banner" style="background-color: #334155;">
            <h2 class="fw-bold mb-3">Account Recovery 🔑</h2>
            <p class="mb-0" style="font-size: 1rem; opacity: 0.85; line-height: 1.6;">Otorisasi pemulihan dilakukan secara instan tanpa membutuhkan konfirmasi email yang lama.</p>
        </div>

        <div class="auth-form-wrapper d-flex flex-column justify-content-center">
            <h1 class="fw-bold text-dark mb-1">Reset Password</h1>
            <p class="text-muted small mb-4">Gunakan PIN 6 digit pilihan Anda saat pendaftaran</p>

            <div th:if="${error}" class="p-3 mb-3 small rounded-3 bg-danger" style="border-left: 4px solid var(--danger);">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" method="post" class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label">Username Akun</label>
                    <input type="text" name="username" placeholder="Masukkan username" required class="form-control">
                </div>
                <div>
                    <label class="form-label">Recovery PIN</label>
                    <input type="text" name="recoveryPin" maxlength="6" placeholder="6 digit PIN" required class="form-control">
                </div>
                <div>
                    <label class="form-label">Password Baru</label>
                    <input type="password" name="newPassword" placeholder="••••••••" required class="form-control">
                </div>
                
                <button type="submit" class="btn-auth w-100 mt-2">Perbarui Kata Sandi</button>
            </form>

            <div class="text-center mt-4 small text-muted">
                Kembali ke halaman utama? <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--accent-blue);">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
