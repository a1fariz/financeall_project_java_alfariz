<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - FinanceAll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page"> 
    <div class="auth-container">
        <div class="auth-banner color-block-cream">
            <span class="eyebrow mb-2">RECOVERY</span>
            <h2 class="headline fw-bold mb-3">FinanceAll.</h2>
            <p class="body-sm mb-0" style="color: var(--color-ink);">Otorisasi pemulihan dilakukan secara instan tanpa membutuhkan konfirmasi email yang lama.</p>
        </div>

        <div class="auth-form-wrapper d-flex flex-column justify-content-center">
            <h1 class="headline fw-bold mb-1">Reset Password</h1>
            <p class="caption mb-4" style="color: #666666;">Gunakan PIN 6 digit pilihan Anda saat pendaftaran</p>

            <div th:if="${error}" class="p-3 mb-3 badge bg-danger w-100 justify-content-start text-start">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" method="post" class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label">USERNAME AKUN</label>
                    <input type="text" name="username" placeholder="Masukkan username" required class="form-control">
                </div>
                <div>
                    <label class="form-label">RECOVERY PIN</label>
                    <input type="text" name="recoveryPin" maxlength="6" placeholder="6 digit PIN" required class="form-control">
                </div>
                <div>
                    <label class="form-label">PASSWORD BARU</label>
                    <input type="password" name="newPassword" placeholder="••••••••" required class="form-control">
                </div>
                
                <button type="submit" class="btn-primary w-100 mt-2">Perbarui Kata Sandi</button>
            </form>

            <div class="text-center mt-4 body-sm" style="color: #666666;">
                Kembali ke halaman utama? <a th:href="@{/login}" class="fw-bold" style="color: var(--color-ink);">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
