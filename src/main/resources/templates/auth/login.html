<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanceAll</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-banner">
            <h2 class="fw-bold mb-3">Secure Access 🔐</h2>
            <p class="mb-0" style="font-size: 1rem; opacity: 0.85; line-height: 1.6;">Kelola dana darurat, pantau debt payoff tracker, dan akselerasi kebebasan finansial Anda di platform terintegrasi.</p>
        </div>
        
        <div class="auth-form-wrapper d-flex flex-column justify-content-center">
            <h1 class="fw-bold text-dark mb-1" style="letter-spacing: -0.03em;">Sign In</h1>
            <p class="text-muted small mb-4">Masukkan kredensial akun Anda untuk melanjutkan</p>

            <div th:if="${error}" class="p-3 mb-3 small rounded-3 bg-danger" style="border-left: 4px solid var(--danger);">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${success}" class="p-3 mb-3 small rounded-3 bg-success" style="border-left: 4px solid var(--success);">
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label">Username</label>
                    <input type="text" name="username" placeholder="Masukkan username" required class="form-control">
                </div>
                <div>
                    <label class="form-label">Password</label>
                    <input type="password" name="password" placeholder="••••••••" required class="form-control">
                </div>
                
                <div class="d-flex justify-content-between align-items-center mt-1 mb-2">
                    <label class="d-flex align-items-center gap-2 small text-secondary" style="cursor: pointer;">
                        <input type="checkbox" style="accent-color: var(--accent-blue);"> Tetap Masuk
                    </label>
                    <a th:href="@{/reset-password}" class="small text-decoration-none fw-semibold" style="color: var(--accent-blue);">Lupa Password?</a>
                </div>
                
                <button type="submit" class="btn-auth w-100">Masuk Aplikasi</button>
            </form>
            
            <div class="text-center mt-4 small text-muted">
                Belum terdaftar? <a th:href="@{/register}" class="fw-bold text-decoration-none" style="color: var(--accent-blue);">Buat Akun Baru</a>
            </div>
        </div>
    </div>
</body>
</html>
